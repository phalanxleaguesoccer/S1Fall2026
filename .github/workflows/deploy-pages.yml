name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main"]
  # Rebuild hourly so the exported data/ JSON picks up results saved in Admin.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Build site (live from public/, plus a preprod copy when preprod/config.js exists)
        run: |
          mkdir -p _site
          cp -r public/. _site/
          if [ -f preprod/config.js ]; then
            mkdir -p _site/preprod
            cp -r public/. _site/preprod/
            cp preprod/config.js _site/preprod/js/config.js
            echo "Preprod copy built at /preprod/"
          fi
      - name: Export league data as JSON (data/*.json)
        # Never blocks the deploy: if Supabase is unreachable the site still
        # publishes, just without the data/ folder.
        continue-on-error: true
        run: |
          if ! node scripts/export-data.mjs _site/data; then
            echo "::warning::League data export failed; publishing the site without data/*.json"
          fi
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

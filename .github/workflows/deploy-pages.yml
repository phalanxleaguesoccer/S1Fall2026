name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Build site (live from public/, plus a preprod copy when preprod/config.js exists)
        run: |
          mkdir -p _site
          cp -r public/. _site/
          if [ -f preprod/config.js ]; then
            mkdir -p _site/preprod
            cp -r public/. _site/preprod/
            cp preprod/config.js _site/preprod/js/config.js
            echo "Preprod copy built at /preprod/"
          fi
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

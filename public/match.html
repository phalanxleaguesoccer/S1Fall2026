<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match — Phalanx League Soccer</title>
<link rel="stylesheet" href="css/app.css">
<link rel="icon" type="image/png" href="assets/brand/favicon.png">
</head>
<body>
<div class="container">
  <h1 id="match-title">Loading…</h1>
  <p class="muted" id="match-meta"></p>
  <p class="muted" id="page-views" style="font-size:0.82rem;"></p>

  <div class="card" id="lineups-card" style="display:none;">
    <div class="card-title">Lineups</div>
    <div id="lineups" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:18px;"></div>
  </div>

  <div class="card">
    <div class="card-title">Events</div>
    <div id="events-list"><p class="muted">Loading…</p></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/common.js"></script>
<script>
renderHeader("matches.html");
renderFooter();
renderBreadcrumbs([{ label: "Home", href: "index.html" }, { label: "Matches", href: "matches.html" }, { label: "…" }]);

var matchId = qs("id");

async function loadLineups(m) {
  var aRes = await window.sb.from("match_appearances").select("*").eq("match_id", matchId);
  var apps = aRes.data || [];
  if (!apps.length) return;
  var pRes = await window.sb.from("players").select("id, full_name").in("id", apps.map(function (a) { return a.player_id; }));
  var names = {}; (pRes.data || []).forEach(function (p) { names[p.id] = p.full_name; });
  var labels = [["played", "Played"], ["rested", "Rested"], ["absent", "Absent"]];
  document.getElementById("lineups").innerHTML = [m.home, m.away].map(function (team) {
    var mine = apps.filter(function (a) { return a.team_id === team.id; });
    return "<div><h3 style=\"margin:0 0 8px;\">" + escapeHtml(team.name) + "</h3>" + labels.map(function (l) {
      var list = mine.filter(function (a) { return (a.status || "played") === l[0]; })
        .map(function (a) { return '<a href="player.html?id=' + a.player_id + '">' + escapeHtml(names[a.player_id] || "?") + "</a>"; })
        .sort();
      return '<p style="margin:6px 0;"><span class="muted">' + l[1] + " (" + list.length + "):</span> " + (list.length ? list.join(", ") : "—") + "</p>";
    }).join("") + "</div>";
  }).join("");
  document.getElementById("lineups-card").style.display = "";
}

async function loadMatch() {
  if (!matchId) return;
  var mRes = await window.sb.from("matches").select("*, home:teams!matches_home_team_id_fkey(*), away:teams!matches_away_team_id_fkey(*)").eq("id", matchId).single();
  if (!mRes.data) { document.getElementById("match-title").textContent = "Match not found"; return; }
  var m = mRes.data;
  var scoreStr = m.status === "completed" ? (m.home_score + " – " + m.away_score) : (m.status === "forfeited" ? "Forfeit" : "vs");
  document.getElementById("match-title").textContent = m.home.name + " " + scoreStr + " " + m.away.name;
  document.getElementById("crumb-current").textContent = "Day " + m.match_day + " Match " + m.match_number;
  document.getElementById("match-meta").innerHTML =
    "Match Day " + m.match_day + " &middot; Match " + m.match_number +
    '<span class="pill ' + m.status + '" style="margin-left:8px;">' + m.status + "</span>" +
    (m.kickoff_at ? " &middot; " + formatKickoff(m.kickoff_at) : "");

  await loadLineups(m);

  var eventsRes = await window.sb.from("match_events").select("*, players!match_events_player_id_fkey(*), teams(*)").eq("match_id", matchId).order("minute", { ascending: true });
  var list = document.getElementById("events-list");
  if (!eventsRes.data || eventsRes.data.length === 0) {
    list.innerHTML = '<p class="muted">No events logged for this match yet.</p>';
    return;
  }
  var typeLabel = { goal: "⚽ Goal", assist: "🅰️ Assist", yellow_card: "🟨 Yellow", red_card: "🟥 Red", substitution_in: "⬆ Sub on", substitution_out: "⬇ Sub off", player_of_match: "⭐ Player of the Match", save: "🧤 Goal Saved", player_of_tournament: "🏆 Player of the Tournament" };
  list.innerHTML = eventsRes.data.map(function (e) {
    return '<div style="padding:8px 0; border-bottom:1px solid var(--card-edge); display:flex; justify-content:space-between; gap:10px;">' +
      "<span>" + (typeLabel[e.event_type] || e.event_type) + " &middot; " +
      '<a href="player.html?id=' + e.players.id + '">' + escapeHtml(e.players.full_name) + "</a> (" + escapeHtml(e.teams.name) + ")</span>" +
      "<span class=\"muted\">" + (e.minute ? e.minute + "'" : "") + "</span>" +
      "</div>";
  }).join("");
}
loadMatch();
if (matchId) {
  trackPageView("match:" + matchId).then(function (count) {
    document.getElementById("page-views").textContent = "Page viewed " + formatViewCount(count);
  });
}
</script>
</body>
</html>

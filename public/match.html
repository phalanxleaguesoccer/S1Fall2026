<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match — Phalanx League Soccer</title>
<link rel="stylesheet" href="css/app.css">
<link rel="icon" type="image/png" href="assets/brand/favicon.png">
<style>
.m-wrap { display:flex; flex-direction:column; gap:20px; }
.m-card { background:var(--card-charcoal); border:1px solid var(--card-edge); border-radius:16px; padding:24px 28px; }
.m-label { font-size:14px; font-weight:700; letter-spacing:.1em; color:var(--chalk-dim); text-transform:uppercase; }
.m-sub { font-size:13px; color:var(--chalk-dim); }
.m-anton { font-family:'Anton',sans-serif; }
.m-hero { display:flex; flex-direction:column; gap:18px; padding:30px 36px; }
.m-hero-top { display:flex; justify-content:center; align-items:center; gap:12px; flex-wrap:wrap; font-size:14px; color:var(--chalk-dim); }
.m-ft { font-size:12px; font-weight:700; letter-spacing:.06em; color:#0E3B2E; background:#7FD1A8; padding:3px 10px; border-radius:999px; }
.m-ft.other { background:rgba(183,176,160,.25); color:var(--chalk-dim); }
.m-board { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:24px; }
.m-side { display:flex; align-items:center; gap:20px; min-width:0; }
.m-side.home { justify-content:flex-end; text-align:right; }
.m-crest { width:88px; height:88px; flex:none; border-radius:16px; background:var(--pitch-green); border:1px solid var(--card-edge); overflow:hidden; }
.m-team { font-family:'Anton',sans-serif; font-size:40px; text-transform:uppercase; line-height:1.05; overflow-wrap:anywhere; }
.m-team a { color:var(--chalk-white); }
.m-scorers { font-size:14px; color:var(--chalk-dim); margin-top:8px; line-height:1.6; }
.m-score { text-align:center; min-width:220px; }
.m-score .big { font-family:'Anton',sans-serif; font-size:96px; line-height:1; letter-spacing:.04em; white-space:nowrap; }
.m-score .big span { color:#6E6A60; }
.m-meta { display:flex; justify-content:center; gap:16px; flex-wrap:wrap; font-size:13px; color:var(--chalk-dim); }
.m-potm { display:flex; align-items:center; gap:20px; background:linear-gradient(90deg,#3A2A0E 0%,#1C1C1F 70%); border:1px solid #5C4518; border-radius:16px; padding:20px 28px; }
.m-potm .ph { width:72px; height:72px; flex:none; border-radius:50%; background:var(--pitch-green); border:2px solid var(--amber); overflow:hidden; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--chalk-dim); }
.m-potm .ph img { width:100%; height:100%; object-fit:cover; display:block; }
.m-potm .tag { font-size:12px; font-weight:700; letter-spacing:.12em; color:var(--amber); }
.m-potm .nm { font-family:'Anton',sans-serif; font-size:32px; text-transform:uppercase; margin-top:2px; }
.m-potm .nm a { color:var(--chalk-white); }
.m-potm .nums { display:flex; gap:28px; text-align:center; margin-left:auto; }
.m-potm .nums b { display:block; font-family:'Anton',sans-serif; font-size:32px; font-weight:400; }
.m-potm .nums span { font-size:12px; color:var(--chalk-dim); letter-spacing:.06em; }
.m-two { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:20px; }
.m-stat { display:flex; flex-direction:column; gap:6px; margin-top:16px; }
.m-stat-row { display:flex; justify-content:space-between; align-items:baseline; }
.m-stat-row b { font-family:'Anton',sans-serif; font-size:22px; font-weight:400; }
.m-stat-row span { font-size:14px; color:var(--chalk-dim); }
.m-bars { display:flex; gap:6px; height:8px; }
.m-bars > div { flex:1; background:#2A2A2E; border-radius:4px; display:flex; overflow:hidden; }
.m-bars > div:first-child { justify-content:flex-end; }
.m-bars i { display:block; height:8px; border-radius:4px; }
.m-break { display:flex; align-items:center; gap:12px; padding:12px 0 6px; font-size:13px; font-weight:700; letter-spacing:.08em; color:var(--chalk-dim); }
.m-break:before, .m-break:after { content:""; flex:1; height:1px; background:var(--card-edge); }
.m-ev { display:grid; grid-template-columns:76px minmax(0,1fr) 60px; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid #26262A; }
.m-cap { display:inline-block; margin-left:6px; padding:0 6px; border-radius:4px; background:var(--amber); color:#082A20; font-size:11px; font-weight:800; letter-spacing:.04em; vertical-align:middle; }
.m-chip { font-size:11px; font-weight:700; letter-spacing:.06em; text-align:center; padding:4px 0; border-radius:6px; }
.m-chip.goal { background:var(--amber); color:#082A20; }
.m-chip.yc { background:#E8C547; color:#1C1C1F; }
.m-chip.rc { background:#C0392B; color:#fff; }
.m-chip.sv { background:#2F5D8A; color:#F5F1E6; }
.m-chip.og { background:#3A3A3E; color:#F5F1E6; border:1px solid var(--amber); }
.m-chip.fl { background:#6B4E1E; color:#F5F1E6; }
.m-chip.sub { background:#3A3A3E; color:#F5F1E6; }
.m-ev .main { font-size:15px; font-weight:600; }
.m-ev .main a { color:var(--chalk-white); }
.m-ev .score { font-family:'Anton',sans-serif; font-size:16px; text-align:right; white-space:nowrap; }
.m-lineups { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:40px; margin-top:16px; }
.m-tname { font-family:'Anton',sans-serif; font-size:22px; text-transform:uppercase; }
.m-tname a { color:var(--chalk-white); }
.m-prow { display:flex; align-items:center; gap:12px; padding:8px 0; border-bottom:1px solid #26262A; }
.m-prow .av { width:36px; height:36px; flex:none; border-radius:50%; background:var(--pitch-green); border:1px solid var(--card-edge); overflow:hidden; }
.m-prow .av img { width:100%; height:100%; object-fit:cover; display:block; }
.m-prow a { color:var(--chalk-white); font-weight:600; font-size:15px; }
.m-prow .line { margin-left:auto; font-size:13px; color:var(--chalk-dim); text-align:right; }
.m-sm { font-size:12px; font-weight:700; letter-spacing:.08em; color:var(--chalk-dim); margin-top:10px; }
.m-ptable { width:100%; border-collapse:collapse; font-size:14px; margin-bottom:8px; }
.m-ptable th { text-align:left; font-size:12px; font-weight:700; letter-spacing:.06em; color:var(--chalk-dim); padding:8px 6px; border-bottom:1px solid var(--card-edge); }
.m-ptable td { padding:9px 6px; border-bottom:1px solid #26262A; }
.m-ptable td a { color:var(--chalk-white); font-weight:600; }
.m-ptable .num { text-align:center; }
.m-scroll { overflow-x:auto; }
@media (max-width: 820px) {
  .m-card { padding:18px 16px; }
  .m-hero { padding:20px 14px; }
  .m-board { grid-template-columns:1fr; gap:14px; }
  .m-side, .m-side.home { justify-content:flex-start; text-align:left; flex-direction:row; }
  .m-side.home { order:1; } .m-score { order:2; min-width:0; } .m-side.away { order:3; }
  .m-side.home .m-crest { order:-1; }
  .m-team { font-size:30px; }
  .m-crest { width:64px; height:64px; }
  .m-score .big { font-size:72px; }
  .m-two, .m-lineups { grid-template-columns:1fr; gap:20px; }
  .m-potm { flex-wrap:wrap; padding:16px; }
  .m-potm .nums { margin-left:0; width:100%; justify-content:space-around; }
  .m-ev { grid-template-columns:64px minmax(0,1fr) 52px; gap:8px; }
}
</style>
</head>
<body>
<div class="container">
  <div id="page-top"><h1 id="match-title">Loading…</h1></div>
  <div class="m-wrap" id="match-root"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/common.js"></script>
<script>
renderHeader("matches.html");
renderFooter();
renderBreadcrumbs([{ label: "Home", href: "index.html" }, { label: "Matches", href: "matches.html" }, { label: "…" }]);

var matchId = qs("id");

function crest(t, size) {
  return t.crest_url
    ? '<img src="' + escapeHtml(t.crest_url) + '" alt="' + escapeHtml(t.name) + '" style="width:100%;height:100%;object-fit:cover;display:block;">'
    : '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Anton,sans-serif;font-size:' + (size || "30px") + ';color:var(--chalk-dim);">' + escapeHtml(t.name.slice(0, 1).toUpperCase()) + "</div>";
}
function plink(p, text) { return '<a href="player.html?id=' + p.id + '">' + escapeHtml(text || p.full_name) + "</a>"; }
function clock(e) {   // "8:20" when seconds were recorded, "8'" otherwise
  if (e.minute == null) return "";
  return e.second != null ? e.minute + ":" + (e.second < 10 ? "0" : "") + e.second : e.minute + "'";
}
function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }

// Order inside a half: by minute when every event in that half has one, otherwise the order they were entered.
function ordered(arr) {
  var allMin = arr.every(function (e) { return e.minute != null; });
  return arr.map(function (e, i) { return { e: e, i: i }; }).sort(function (x, y) {
    return (allMin ? (x.e.minute * 60 + (x.e.second || 0)) - (y.e.minute * 60 + (y.e.second || 0)) : 0) || x.i - y.i;
  }).map(function (o) { return o.e; });
}
// Pair each goal with its assist (explicit link first, else next unused assist from the same team in that half).
function pairAssists(arr) {
  var used = {}, goalAssist = {};
  var assists = arr.filter(function (e) { return e.event_type === "assist"; });
  arr.forEach(function (g) {
    if (g.event_type !== "goal" && g.event_type !== "own_goal") return;
    var hit = assists.filter(function (a) { return !used[a.id] && ((g.related_player_id && a.player_id === g.related_player_id) || a.related_player_id === g.player_id); })[0];
    if (hit) { used[hit.id] = 1; goalAssist[g.id] = hit; }
  });
  arr.forEach(function (g) {
    if ((g.event_type !== "goal" && g.event_type !== "own_goal") || goalAssist[g.id]) return;
    var og = g.event_type === "own_goal";   // an own goal's assist comes from the other team
    var hit = assists.filter(function (a) { return !used[a.id] && (og ? a.team_id !== g.team_id : a.team_id === g.team_id) && a.player_id !== g.player_id; })[0];
    if (hit) { used[hit.id] = 1; goalAssist[g.id] = hit; }
  });
  return { used: used, goalAssist: goalAssist };
}

async function loadMatch() {
  var root = document.getElementById("match-root");
  if (!matchId) { document.getElementById("match-title").textContent = "Match not found"; return; }
  var mRes = await window.sb.from("matches").select("*, home:teams!matches_home_team_id_fkey(*), away:teams!matches_away_team_id_fkey(*)").eq("id", matchId).single();
  if (!mRes.data) { document.getElementById("match-title").textContent = "Match not found"; return; }
  var m = mRes.data, home = m.home, away = m.away;
  var done = m.status === "completed";
  document.getElementById("page-top").innerHTML = "";
  document.getElementById("crumb-current").textContent = "Day " + m.match_day + " Match " + m.match_number;
  document.title = home.name + " vs " + away.name + " — Phalanx League Soccer";

  var aRes = await window.sb.from("match_appearances").select("*").eq("match_id", matchId);
  var apps = aRes.data || [];
  var eRes = await window.sb.from("match_events").select("*, players!match_events_player_id_fkey(*), teams(*)").eq("match_id", matchId).order("created_at", { ascending: true });
  var evs = (eRes.data || []).filter(function (e) { return e.players && e.teams; });

  // players: from events (already embedded) plus lineup rows
  var P = {};
  evs.forEach(function (e) { P[e.players.id] = e.players; });
  var needIds = apps.map(function (a) { return a.player_id; }).filter(function (id) { return !P[id]; });
  if (needIds.length) {
    var pRes = await window.sb.from("players").select("*").in("id", needIds);
    (pRes.data || []).forEach(function (p) { P[p.id] = p; });
  }

  // ---- per-player and per-team tallies ----
  var T = {}; T[home.id] = { team: home, goals: 0, assists: 0, yc: 0, rc: 0, sv: 0, og: 0, fl: 0 }; T[away.id] = { team: away, goals: 0, assists: 0, yc: 0, rc: 0, sv: 0, og: 0, fl: 0 };
  var S = {};   // player id -> stats
  function ps(e) { return S[e.player_id] = S[e.player_id] || { g: 0, a: 0, yc: 0, rc: 0, sv: 0, og: 0, fl: 0, team_id: e.team_id }; }
  var potm = [], awards = [], anySave = false, anyOG = false, anyFoul = false;
  evs.forEach(function (e) {
    var t = T[e.team_id], s = ps(e);
    if (e.event_type === "goal") { s.g++; if (t) t.goals++; }
    else if (e.event_type === "own_goal") { s.og++; if (t) t.og++; anyOG = true; }   // own goal: team_id is the scorer's own team; the goal counts for the other team
    else if (e.event_type === "foul") { s.fl++; if (t) t.fl++; anyFoul = true; }
    else if (e.event_type === "assist") { s.a++; if (t) t.assists++; }
    else if (e.event_type === "yellow_card") { s.yc++; if (t) t.yc++; }
    else if (e.event_type === "red_card") { s.rc++; if (t) t.rc++; }
    else if (e.event_type === "save") { s.sv++; if (t) t.sv++; anySave = true; }
    else if (e.event_type === "player_of_match") potm.push(e);
    else if (e.event_type === "player_of_tournament") awards.push(e);
  });
  function scorersText(teamId) {
    var by = {}, order = [], ogs = [], pens = {};
    evs.forEach(function (e) {
      if (e.event_type === "own_goal" && e.team_id !== teamId) { ogs.push(plink(P[e.player_id]) + " (og)"); return; }   // other team's player put it in
      if (e.event_type !== "goal" || e.team_id !== teamId) return;
      if (!by[e.player_id]) { by[e.player_id] = 0; pens[e.player_id] = 0; order.push(e.player_id); }
      by[e.player_id]++; if (e.is_penalty) pens[e.player_id]++;
    });
    return order.map(function (id) { return plink(P[id]) + (by[id] > 1 ? " ×" + by[id] : "") + (pens[id] ? " (" + (by[id] > 1 ? pens[id] + " " : "") + "pen)" : ""); }).concat(ogs).join(" · ");
  }

  // ---- timeline pieces (halves, running score) ----
  var halves = [{ key: 1, title: "FIRST HALF", rows: [] }, { key: 2, title: "SECOND HALF", rows: [] }, { key: 0, title: "HALF NOT RECORDED", rows: [] }];
  var allGoalsHaveHalf = true;
  evs.forEach(function (e) {
    if (e.event_type === "player_of_match" || e.event_type === "player_of_tournament") return;
    var h = e.half === 1 ? halves[0] : (e.half === 2 ? halves[1] : halves[2]);
    h.rows.push(e);
    if ((e.event_type === "goal" || e.event_type === "own_goal") && e.half !== 1 && e.half !== 2) allGoalsHaveHalf = false;
  });
  var chipFor = { goal: ["GOAL", "goal"], own_goal: ["OWN GOAL", "og"], foul: ["FOUL", "fl"], yellow_card: ["YELLOW", "yc"], red_card: ["RED", "rc"], save: ["SAVE", "sv"], substitution_in: ["SUB ON", "sub"], substitution_out: ["SUB OFF", "sub"] };
  var rh = 0, ra = 0, htHome = 0, htAway = 0, tl = "";
  halves.forEach(function (h) {
    if (!h.rows.length) return;
    var rows = ordered(h.rows), pa = pairAssists(rows);
    tl += '<div class="m-break">' + h.title + "</div>";
    rows.forEach(function (e) {
      if (e.event_type === "assist" && pa.used[e.id]) return;
      var c = chipFor[e.event_type] || [e.event_type.replace(/_/g, " ").toUpperCase(), "sub"];
      var sub, score = "";
      if (e.event_type === "goal") {
        if (e.team_id === home.id) rh++; else if (e.team_id === away.id) ra++;
        var as = pa.goalAssist[e.id];
        sub = (e.is_penalty ? "Penalty · " : "") + (as ? "Assist: " + plink(as.players) : (e.is_penalty ? "" : "Unassisted")); sub = sub.replace(/ · $/, "");
        score = rh + " – " + ra;
      } else if (e.event_type === "own_goal") {
        var benefit = e.team_id === home.id ? away : home;
        if (benefit.id === home.id) rh++; else ra++;
        var oas = pa.goalAssist[e.id];
        sub = "Counts for " + escapeHtml(benefit.name) + (oas ? " · Assist: " + plink(oas.players) : "");
        score = rh + " – " + ra;
      } else if (e.event_type === "assist") sub = "Assist";
      else if (e.event_type === "foul") sub = "Foul committed";
      else if (e.event_type === "yellow_card") sub = "Yellow card";
      else if (e.event_type === "red_card") sub = "Red card";
      else if (e.event_type === "save") sub = "Goal saved";
      else sub = "Substitution";
      tl += '<div class="m-ev"><span class="m-chip ' + c[1] + '">' + c[0] + '</span><div><div class="main">' + plink(e.players) + " (" + escapeHtml(e.teams.name) + ')</div><div class="m-sub">' + sub +
        (e.minute != null ? " · " + clock(e) : "") + '</div></div><span class="score">' + score + "</span></div>";
    });
    if (h.key === 1) { htHome = rh; htAway = ra; }
  });
  if (done) tl += '<div class="m-break">FULL TIME &nbsp;' + m.home_score + " – " + m.away_score + "</div>";
  var hasHalfTime = done && allGoalsHaveHalf && halves[0].rows.length + halves[1].rows.length > 0;

  var html = "";

  // ---- hero ----
  var tossTeam = m.toss_winner_team_id === home.id ? home : (m.toss_winner_team_id === away.id ? away : null);
  var tossText = tossTeam ? "<span>Toss: " + escapeHtml(tossTeam.name) + (m.toss_choice === "kickoff" ? " · chose to kick off" : (m.toss_choice === "side" ? " · chose side" : "")) + "</span>" : "";
  var scoreBig = done ? m.home_score + " <span>–</span> " + m.away_score : (m.status === "forfeited" ? '<span style="font-size:48px;">Forfeit</span>' : "<span>vs</span>");
  var pillText = done ? "FULL TIME" : m.status.toUpperCase();
  html += '<section class="m-card m-hero"><div class="m-hero-top"><span>Match Day ' + m.match_day + " · Match " + m.match_number + '</span><span class="m-ft' + (done ? "" : " other") + '">' + pillText + "</span>" +
    (m.kickoff_at ? "<span>" + formatKickoff(m.kickoff_at) + "</span>" : "") + "</div>" +
    '<div class="m-board">' +
      '<div class="m-side home"><div><div class="m-team"><a href="team.html?id=' + home.id + '">' + escapeHtml(home.name) + '</a></div><div class="m-scorers">' + (done ? scorersText(home.id) : "") + '</div></div><div class="m-crest">' + crest(home) + "</div></div>" +
      '<div class="m-score"><div class="big">' + scoreBig + "</div>" + (hasHalfTime ? '<div class="m-sub" style="margin-top:8px;">Half-time ' + htHome + " – " + htAway + "</div>" : "") + "</div>" +
      '<div class="m-side away"><div class="m-crest">' + crest(away) + '</div><div><div class="m-team"><a href="team.html?id=' + away.id + '">' + escapeHtml(away.name) + '</a></div><div class="m-scorers">' + (done ? scorersText(away.id) : "") + "</div></div></div>" +
    '</div><div class="m-meta">' + tossText + '<span id="page-views"></span></div></section>';

  // ---- player of the match ----
  if (potm.length) {
    html += potm.map(function (e) {
      var p = e.players, s = S[p.id] || { g: 0, a: 0 };
      return '<section class="m-potm"><div class="ph">' + (p.photo_url ? '<img src="' + escapeHtml(p.photo_url) + '" alt="' + escapeHtml(p.full_name) + '">' : "Photo") + '</div>' +
        '<div><div class="tag">PLAYER OF THE MATCH</div><div class="nm">' + plink(p) + '</div><div class="m-sub" style="font-size:14px;">' + escapeHtml(e.teams.name) + (p.preferred_position ? " · " + escapeHtml(p.preferred_position) : "") + "</div></div>" +
        '<div class="nums"><div><b>' + s.g + "</b><span>GOALS</span></div><div><b>" + s.a + "</b><span>ASSISTS</span></div><div><b>" + (s.g + s.a) + "</b><span>G + A</span></div></div></section>";
    }).join("");
  }

  // ---- stats + timeline ----
  var statDefs = [["Goals", "goals"], ["Assists", "assists"], ["Fouls", "fl"], ["Yellow cards", "yc"], ["Red cards", "rc"]];
  if (anyOG) statDefs.push(["Own goals", "og"]);
  if (anySave) statDefs.push(["Goals saved", "sv"]);
  var statsHtml = "";
  if (done) {
    statsHtml = '<section class="m-card"><div class="m-label">Match stats</div>' +
      '<div class="m-stat-row" style="margin-top:14px; font-size:13px; font-weight:600; color:var(--chalk-dim);"><span>' + escapeHtml(home.name) + "</span><span>" + escapeHtml(away.name) + "</span></div>" +
      statDefs.map(function (d) {
        var a = T[home.id][d[1]], b = T[away.id][d[1]], mx = Math.max(a, b, 1);
        if (d[1] === "goals") { a = m.home_score; b = m.away_score; mx = Math.max(a, b, 1); }
        return '<div class="m-stat"><div class="m-stat-row"><b>' + a + "</b><span>" + d[0] + "</span><b>" + b + '</b></div><div class="m-bars"><div><i style="width:' + Math.round(a / mx * 100) + '%; background:var(--amber);"></i></div><div><i style="width:' + Math.round(b / mx * 100) + '%; background:var(--chalk-white);"></i></div></div></div>';
      }).join("") + "</section>";
  }
  var tlHtml = '<section class="m-card"><div class="m-label">How it happened</div>' +
    '<div class="m-sub" style="margin:4px 0 4px;">Grouped by half. A minute shows only if one was entered.</div>' +
    (tl || '<p class="muted" style="margin-top:12px;">No events logged for this match yet.</p>') +
    (awards.length ? '<div style="padding-top:12px;">🏆 <strong>Player of the Tournament</strong> · ' + awards.map(function (e) { return plink(e.players) + " (" + escapeHtml(e.teams.name) + ")"; }).join(", ") + "</div>" : "") + "</section>";
  html += statsHtml ? '<div class="m-two">' + statsHtml + tlHtml + "</div>" : tlHtml;

  // ---- who played / player stats ----
  function lineFor(id) {
    var s = S[id]; if (!s) return "";
    var bits = [];
    if (s.g) bits.push(plural(s.g, "goal", "goals"));
    if (s.a) bits.push(plural(s.a, "assist", "assists"));
    if (s.og) bits.push(plural(s.og, "own goal", "own goals"));
    if (s.sv) bits.push(plural(s.sv, "save", "saves"));
    if (s.fl) bits.push(plural(s.fl, "foul", "fouls"));
    if (s.yc) bits.push("Yellow");
    if (s.rc) bits.push("Red");
    return bits.join(" · ");
  }
  var hasLineup = apps.length > 0;
  var capOf = {};   // team id -> appearance row of its captain in this match
  apps.forEach(function (a) { if (a.is_captain) capOf[a.team_id] = a; });
  var capTag = function (p, teamId) {
    var c = capOf[teamId];
    return c && p && c.player_id === p.id ? '<span class="m-cap" title="' + (c.captain_stand_in ? "Stand-in captain" : "Captain") + '">C' + (c.captain_stand_in ? " (stand-in)" : "") + "</span>" : "";
  };
  var squads = [home, away].map(function (team) {
    var mine = apps.filter(function (a) { return a.team_id === team.id; });
    var pick = function (st) { return mine.filter(function (a) { return (a.status || "played") === st; }).map(function (a) { return P[a.player_id]; }).filter(Boolean); };
    var played = pick("played");
    var fromEvents = false;
    if (!mine.length) {   // no lineup entered for this team: fall back to players named in events
      var seen = {};
      evs.forEach(function (e) { if (e.team_id === team.id && !seen[e.player_id]) { seen[e.player_id] = 1; played.push(e.players); } });
      fromEvents = played.length > 0;
    }
    played.sort(function (a, b) { return a.full_name.localeCompare(b.full_name); });
    var rested = pick("rested"), absent = pick("absent");
    rested.sort(function (a, b) { return a.full_name.localeCompare(b.full_name); }); absent.sort(function (a, b) { return a.full_name.localeCompare(b.full_name); });
    return { team: team, played: played, rested: rested, absent: absent, fromEvents: fromEvents, hasRows: mine.length > 0 };
  });
  if (squads.some(function (q) { return q.played.length || q.rested.length || q.absent.length; })) {
    html += '<section class="m-card"><div class="m-label">Who played</div><div class="m-lineups">' + squads.map(function (q) {
      var injured = {}; apps.forEach(function (a) { if (a.status === "absent" && a.absent_reason === "injury") injured[a.player_id] = true; });
      var names = function (l) { return l.length ? l.map(function (p) { return plink(p) + capTag(p, q.team.id) + (injured[p.id] ? ' <span class="muted">(injury)</span>' : ""); }).join(", ") : "—"; };
      return "<div><div class=\"m-tname\"><a href=\"team.html?id=" + q.team.id + '">' + escapeHtml(q.team.name) + "</a></div>" +
        (capOf[q.team.id] && P[capOf[q.team.id].player_id] ? '<div class="m-sub" style="margin-bottom:4px;">Captain: ' + plink(P[capOf[q.team.id].player_id]) + (capOf[q.team.id].captain_stand_in ? " (stand-in)" : "") + "</div>" : "") +
        '<div class="m-sm">PLAYED (' + q.played.length + ")</div>" +
        (q.played.length ? q.played.map(function (p) {
          return '<div class="m-prow"><div class="av">' + (p.photo_url ? '<img src="' + escapeHtml(p.photo_url) + '" alt="">' : "") + "</div>" + plink(p) + capTag(p, q.team.id) + '<span class="line">' + lineFor(p.id) + "</span></div>";
        }).join("") : '<div class="m-sub" style="padding:8px 0;">Lineup not recorded.</div>') +
        (q.fromEvents ? '<div class="m-sub" style="margin-top:6px;">Full lineup not recorded; showing players with events.</div>' : "") +
        (q.hasRows ? '<div class="m-sm">RESTED (' + q.rested.length + ')</div><div class="m-sub" style="padding:4px 0;">' + names(q.rested) + '</div><div class="m-sm">ABSENT (' + q.absent.length + ')</div><div class="m-sub" style="padding:4px 0;">' + names(q.absent) + "</div>" : "") +
        "</div>";
    }).join("") + "</div></section>";
  }

  if (done && squads.some(function (q) { return q.played.length; })) {
    html += '<section class="m-card"><div class="m-label">Player stats</div>' + squads.map(function (q) {
      if (!q.played.length) return "";
      return '<div class="m-tname" style="font-size:18px; margin:14px 0 4px;">' + escapeHtml(q.team.name) + '</div><div class="m-scroll"><table class="m-ptable"><thead><tr><th>PLAYER</th><th>POS</th><th class="num">G</th><th class="num">A</th>' +
        (anyOG ? '<th class="num">OG</th>' : "") + (anySave ? '<th class="num">SV</th>' : "") + '<th class="num">FL</th><th class="num">YC</th><th class="num">RC</th></tr></thead><tbody>' +
        q.played.map(function (p) {
          var s = S[p.id] || { g: 0, a: 0, sv: 0, yc: 0, rc: 0, og: 0, fl: 0 };
          return "<tr><td>" + plink(p) + '</td><td class="m-sub">' + escapeHtml(p.preferred_position || "—") + '</td><td class="num">' + s.g + '</td><td class="num">' + s.a + "</td>" +
            (anyOG ? '<td class="num">' + s.og + "</td>" : "") + (anySave ? '<td class="num">' + s.sv + "</td>" : "") + '<td class="num">' + s.fl + '</td><td class="num">' + s.yc + '</td><td class="num">' + s.rc + "</td></tr>";
        }).join("") + "</tbody></table></div>";
    }).join("") + '<div class="m-sub" style="margin-top:8px;">POS = preferred position · G = goals · A = assists · ' + (anyOG ? "OG = own goals · " : "") + (anySave ? "SV = goals saved · " : "") + "FL = fouls · YC / RC = yellow / red cards</div></section>";
  }

  root.innerHTML = html;
  trackPageView("match:" + matchId).then(function (count) {
    var el = document.getElementById("page-views");
    if (el) el.textContent = "Page viewed " + formatViewCount(count);
  });
}
loadMatch();
</script>
</body>
</html>

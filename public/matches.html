<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match Schedule — Phalanx League Soccer</title>
<link rel="stylesheet" href="css/app.css">
<link rel="icon" type="image/png" href="assets/brand/favicon.png">
<style>
  .mt-tabs { display:flex; gap:6px; flex-wrap:wrap; margin:14px 0; }
  .mt-tabs button { padding:9px 16px; border-radius:999px; border:1px solid var(--card-edge); background:var(--card-charcoal); font:inherit; font-size:.88rem; font-weight:600; color:var(--chalk-dim); cursor:pointer; }
  .mt-tabs button.on { background:var(--amber); color:#1C1C1F; border-color:var(--amber); }
  .mt-why { font-size:.78rem; color:var(--chalk-dim); margin:-4px 0 12px; } .mt-why b { color:var(--chalk-white); }
  .mt-next { background:linear-gradient(135deg, rgba(231,169,61,.14), rgba(0,0,0,.27)); border:1px solid rgba(231,169,61,.4); border-radius:14px; padding:14px; margin-bottom:14px; display:flex; justify-content:space-between; gap:12px; align-items:center; flex-wrap:wrap; }
  .mt-next .k { font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; color:var(--amber); font-weight:800; }
  .mt-next .t { font-family:'Anton',sans-serif; font-size:1.5rem; text-transform:uppercase; margin-top:2px; } .mt-next .t a { color:inherit; }
  .mt-next .cd { font-family:'Anton',sans-serif; font-size:1.9rem; color:var(--amber); text-align:right; } .mt-next .cd small { display:block; font-family:'Work Sans',sans-serif; font-size:.68rem; color:var(--chalk-dim); letter-spacing:.1em; text-transform:uppercase; }
  .mt-dh { display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:8px; } .mt-dh h2 { font-size:1.25rem; margin:0; } .mt-dh .s { font-size:.75rem; color:var(--chalk-dim); }
  .mt-badge { font-size:.62rem; font-weight:800; letter-spacing:.08em; border-radius:99px; padding:2px 9px; margin-left:8px; vertical-align:middle; }
  .mt-badge.latest { background:#3ECF6E; color:#04210F; } .mt-badge.next { background:var(--amber); color:#1c1c1f; }
  .match-row { border-top:1px solid var(--card-edge); padding:12px 0; cursor:pointer; } .match-row.first { border-top:0; } .match-row:hover { background:rgba(255,255,255,.025); }
  .mt-r1 { display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center; } .mt-r1 > * { min-width:0; }
  .mt-tm { display:flex; align-items:center; gap:8px; font-weight:700; font-size:.95rem; } .mt-tm.r { justify-content:flex-end; text-align:right; } .mt-tm img, .mt-tm .mt-ph { width:30px; height:30px; object-fit:contain; flex:none; }
  .mt-tm a { color:var(--chalk-white); }
  .mt-ph { display:flex; align-items:center; justify-content:center; border-radius:8px; background:var(--pitch-green); border:1px solid var(--card-edge); font-family:'Anton',sans-serif; color:var(--chalk-dim); }
  .mt-sc { font-family:'Anton',sans-serif; font-size:1.75rem; white-space:nowrap; text-align:center; min-width:76px; } .mt-sc a { color:var(--chalk-white); } .mt-sc .lose { color:var(--chalk-dim); } .mt-sc.vs { font-size:1rem; font-family:'Work Sans',sans-serif; font-weight:700; color:var(--chalk-dim); }
  .mt-meta { display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; font-size:.75rem; color:var(--chalk-dim); margin-top:8px; align-items:center; }
  .mt-links { display:flex; gap:12px; font-weight:600; }
  .mt-ev { display:flex; flex-wrap:wrap; gap:3px 12px; font-size:.75rem; color:var(--chalk-dim); margin-top:6px; } .mt-ev a { color:var(--chalk-dim); } .mt-ev a:hover { color:var(--chalk-white); }
  .mt-att { font-size:.75rem; color:var(--chalk-dim); margin-top:6px; }
  .pill.live { background:var(--coral); color:#fff; animation:mlive 1.4s infinite; } @keyframes mlive { 50% { opacity:.6; } }
  .pill.wait { background:rgba(232,197,71,.15); color:var(--ev-yellow); }
  .pill.W { background:#3ECF6E; color:#04210F; } .pill.D { background:#6b6b70; color:#fff; } .pill.L { background:#C0392B; color:#fff; }
  .mt-filters { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; }
  .mt-filters label { display:block; font-size:.68rem; color:var(--chalk-dim); margin-bottom:3px; letter-spacing:.06em; text-transform:uppercase; }
  .mt-filters select { width:100%; }
  .mt-seg { display:flex; border:1px solid var(--card-edge); border-radius:8px; overflow:hidden; } .mt-seg button { flex:1; background:rgba(0,0,0,.4); color:var(--chalk-dim); border:0; padding:9px 6px; font:inherit; font-size:.82rem; font-weight:600; cursor:pointer; white-space:nowrap; } .mt-seg button.on { background:var(--amber); color:#1c1c1f; }
  .mt-sum { background:rgba(0,0,0,.27); border:1px solid var(--card-edge); border-radius:10px; padding:10px 12px; font-size:.85rem; margin-top:12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .mt-empty { text-align:center; color:var(--chalk-dim); padding:26px 10px; }
  @media (max-width:560px) { .mt-sc { font-size:1.5rem; min-width:62px; } .mt-tm { font-size:.82rem; } .mt-tm img, .mt-tm .mt-ph { width:24px; height:24px; } .mt-next .cd { text-align:left; } }
</style>
</head>
<body>
<div class="container">
  <h1>Match Schedule &amp; Results</h1>
  <p class="muted" id="page-views" style="font-size:0.82rem;"></p>
  <div class="mt-tabs" id="mt-tabs"></div>
  <div class="mt-why" id="mt-why"></div>
  <div id="days-list"><p class="muted">Loading…</p></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/common.js"></script>
<script src="js/live_common.js"></script>
<script>
renderHeader("matches.html");
renderFooter();
renderBreadcrumbs([{ label: "Home", href: "index.html" }, { label: "Matches" }]);

var MT = { season: null, teams: {}, players: {}, matches: [], events: [], att: {}, team: "all", day: "all", status: "all", order: "desc", tab: null, now: function () { return new Date(); } };

function mtDone(m) { return (m.status === "completed" && m.home_score != null && m.away_score != null) || m.status === "forfeited"; }
function mtLive(m) { return LIVE.isLive(m) && m.status === "scheduled"; }
function mtLiveScore(m) { return LIVE.score(m, MT.events.filter(function (e) { return e.match_id === m.id; })); }
function mtLiveText(m) { var t = LIVE.phaseText(m); if (m.live_phase === "h1" || m.live_phase === "h2") t += " · " + LIVE.played(LIVE.playedNow(m)); return t; }
function mtState(m) { if (mtLive(m)) return "live"; return mtDone(m) ? "done" : (m.kickoff_at && new Date(m.kickoff_at) < MT.now() && m.status !== "postponed" ? "wait" : "up"); }
function mtMine(m) { return MT.team === "all" || m.home_team_id === MT.team || m.away_team_id === MT.team; }
function mtDays() {
  var o = {};
  MT.matches.forEach(function (m) { (o[m.match_day] = o[m.match_day] || []).push(m); });
  Object.keys(o).forEach(function (d) { o[d].sort(function (a, b) { return a.match_number - b.match_number; }); });
  return o;
}
function mtDayNums() { return Object.keys(mtDays()).map(Number).sort(function (a, b) { return a - b; }); }
function mtDayDate(d) {
  var ms = mtDays()[d], k = ms.filter(function (m) { return m.kickoff_at; })[0];
  return k ? new Date(k.kickoff_at).toLocaleDateString("en-US", { timeZone: "America/New_York", weekday: "short", month: "short", day: "numeric" }) : "";
}
function mtLatestDone() { var l = null; mtDayNums().forEach(function (d) { if (mtDays()[d].some(mtDone)) l = d; }); return l; }
function mtHasUpcoming() { return MT.matches.some(function (m) { return !mtDone(m); }); }

// Weekly rule (Eastern time): Upcoming is first and the default from Friday 12:00 AM to Tuesday 8:30 PM;
// Recent is first and the default from Tuesday 8:31 PM to Thursday 11:59 PM.
function mtEt(d) {
  var p = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", weekday: "short", hour: "numeric", minute: "numeric", hour12: false }).formatToParts(d), g = function (t) { return p.filter(function (x) { return x.type === t; })[0].value; };
  return { dow: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].indexOf(g("weekday")), min: (parseInt(g("hour"), 10) % 24) * 60 + parseInt(g("minute"), 10) };
}
function mtInUpcomingWindow(d) { var e = mtEt(d); return e.dow === 5 || e.dow === 6 || e.dow === 0 || e.dow === 1 || (e.dow === 2 && e.min <= 20 * 60 + 30); }
function mtDefaultTab() {
  if (MT.matches.some(mtLive)) return "upcoming";   // a match is live right now: show it first
  if (!mtHasUpcoming()) return "recent";
  if (mtLatestDone() === null) return "upcoming";
  return mtInUpcomingWindow(MT.now()) ? "upcoming" : "recent";
}

function mtLogo(id, px) {
  var t = MT.teams[id];
  if (t && t.crest_url) return '<img src="' + escapeHtml(t.crest_url) + '" alt="" style="width:' + px + 'px;height:' + px + 'px;">';
  return '<span class="mt-ph" style="width:' + px + 'px;height:' + px + 'px;">' + escapeHtml((t ? t.name : "?").charAt(0)) + "</span>";
}
function mtTname(id) { return MT.teams[id] ? MT.teams[id].name : "TBD"; }
function mtPair(evs) {
  var used = {}, ga = {}, ass = evs.filter(function (e) { return e.event_type === "assist"; });
  var goals = evs.filter(function (e) { return e.event_type === "goal" || e.event_type === "own_goal"; });
  goals.forEach(function (g) {
    var h = ass.filter(function (a) { return !used[a.id] && ((g.related_player_id && a.player_id === g.related_player_id) || a.related_player_id === g.player_id); })[0];
    if (h) { used[h.id] = 1; ga[g.id] = h; }
  });
  goals.forEach(function (g) {
    if (ga[g.id]) return;
    var og = g.event_type === "own_goal";
    var h = ass.filter(function (a) { return !used[a.id] && (og ? a.team_id !== g.team_id : a.team_id === g.team_id) && a.player_id !== g.player_id; })[0];
    if (h) { used[h.id] = 1; ga[g.id] = h; }
  });
  return ga;
}
function mtPlink(id) { var p = MT.players[id]; return playerLink(id, p ? p.full_name : "?"); }
function mtAttText(m) {
  return [["rested", "Rested"], ["absent", "Absent"]].map(function (s) {
    var c = MT.att[m.id + "|" + s[0]];
    if (!c) return "";
    return s[1] + ": " + Object.keys(c).map(function (tid) { return teamLink(tid, mtTname(tid)) + " " + c[tid]; }).join(", ");
  }).filter(Boolean).join(" &middot; ");
}

function mtRow(m, first) {
  var st = mtState(m), done = st === "done", forf = m.status === "forfeited", hs = m.home_score, as = m.away_score, sc, pill, tl = "";
  if (st === "live") {
    var ls = mtLiveScore(m);
    sc = '<div class="mt-sc">' + matchLink(m, ls.h + " – " + ls.a) + "</div>";
    pill = '<span class="pill live mt-live-clock" data-mid="' + m.id + '">LIVE · ' + mtLiveText(m) + "</span>";
  } else if (done && !forf) {
    sc = '<div class="mt-sc">' + matchLink(m, '<span class="' + (as > hs ? "lose" : "") + '">' + hs + '</span> – <span class="' + (hs > as ? "lose" : "") + '">' + as + "</span>") + "</div>";
    pill = '<span class="pill completed">Full time</span>';
  } else if (forf) {
    sc = '<div class="mt-sc vs">' + matchLink(m, "Forfeit") + "</div>"; pill = '<span class="pill forfeited">Forfeit</span>';
  } else {
    sc = '<div class="mt-sc vs">' + matchLink(m, "vs") + "</div>";
    pill = st === "wait" ? '<span class="pill wait">Awaiting result</span>' : '<span class="pill ' + (m.status === "postponed" ? "postponed" : "scheduled") + '">' + (m.status === "postponed" ? "Postponed" : "Scheduled") + "</span>";
  }
  if (done && !forf && MT.team !== "all" && (m.home_team_id === MT.team || m.away_team_id === MT.team)) {
    var f = m.home_team_id === MT.team ? hs : as, o = m.home_team_id === MT.team ? as : hs, x = f > o ? "W" : f < o ? "L" : "D";
    pill = '<span class="pill ' + x + '">' + (x === "W" ? "Win" : x === "L" ? "Loss" : "Draw") + "</span>";
  }
  if ((done || st === "live") && !forf) {
    var evs = MT.events.filter(function (e) { return e.match_id === m.id; }), pa = mtPair(evs), bits = [];
    evs.forEach(function (e) {
      if (e.event_type === "goal") { var a = pa[e.id]; bits.push('<span><i class="evm goal"></i>' + mtPlink(e.player_id) + (a ? ' <i class="evm assist" style="margin-left:6px"></i>' + mtPlink(a.player_id) : "") + "</span>"); }
      else if (e.event_type === "own_goal") bits.push('<span><i class="evm og"></i>' + mtPlink(e.player_id) + " (og)</span>");
    });
    tl = '<div class="mt-ev">' + (bits.length ? bits.join("") : (st !== "live" && hs === 0 && as === 0 ? "<span>Goalless draw</span>" : "")) + "</div>";
  }
  var when = m.kickoff_at ? formatKickoff(m.kickoff_at) : "Kickoff time to be confirmed";
  var h2h = m.home_team_id && m.away_team_id ? '<a href="stats.html#rivalry/' + m.home_team_id + "/" + m.away_team_id + '">Head to head &rsaquo;</a>' : "";
  return '<div class="match-row' + (first ? " first" : "") + '" data-href="match.html?id=' + m.id + '"><div class="mt-r1">' +
    '<div class="mt-tm">' + mtLogo(m.home_team_id, 30) + teamLink(m.home_team_id, mtTname(m.home_team_id)) + "</div>" + sc +
    '<div class="mt-tm r">' + teamLink(m.away_team_id, mtTname(m.away_team_id)) + mtLogo(m.away_team_id, 30) + "</div></div>" +
    '<div class="mt-meta"><span>' + pill + " &nbsp;M" + m.match_number + " &middot; " + when + '</span><span class="mt-links">' + matchLink(m, (done ? "Match report" : "Match page") + " &rsaquo;") + h2h + "</span></div>" +
    tl + (mtAttText(m) ? '<div class="mt-att">' + mtAttText(m) + "</div>" : "") + "</div>";
}
function mtDayCard(d, list, badge) {
  var done = list.filter(mtDone), goals = done.reduce(function (s, m) { return s + (m.home_score || 0) + (m.away_score || 0); }, 0);
  var sum = done.length === list.length ? list.length + " matches · " + goals + " goal" + (goals === 1 ? "" : "s") : done.length ? done.length + " of " + list.length + " played" : list.length + " matches";
  var dt = mtDayDate(d);
  return '<div class="card"><div class="mt-dh"><h2>Match Day ' + d + (dt ? " &middot; " + dt : "") + (badge || "") + '</h2><span class="s">' + sum + "</span></div>" +
    list.map(function (m, i) { return mtRow(m, i === 0); }).join("") + "</div>";
}
function mtTeamSelect(withAllLabel) {
  var ids = Object.keys(MT.teams).filter(function (id) { return !isPlaceholderTeam(MT.teams[id]) && MT.matches.some(function (m) { return m.home_team_id === id || m.away_team_id === id; }); })
    .sort(function (a, b) { return MT.teams[a].name.localeCompare(MT.teams[b].name); });
  return '<label for="mt-team">Team</label><select id="mt-team"><option value="all">All teams</option>' + ids.map(function (id) { return '<option value="' + id + '"' + (MT.team === id ? " selected" : "") + ">" + escapeHtml(MT.teams[id].name) + "</option>"; }).join("") + "</select>";
}
function isPlaceholderTeam(t) { return /^Team [A-Z]$/.test(t.name); }
function mtTeamBar() { return '<div class="card" style="padding:12px 14px;"><div class="mt-filters" style="grid-template-columns:minmax(0,320px);"><div>' + mtTeamSelect() + "</div></div></div>"; }
function mtNone(txt) { return '<div class="card mt-empty">' + txt + "</div>"; }
function mtCd(ms) { var m = Math.max(0, Math.floor(ms / 6e4)), d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60); return d ? d + "d " + h + "h" : h + "h " + (m % 60) + "m"; }

function mtWhy(t, def) {
  if (t !== def) return "";
  var nd = mtUpcomingDays()[0], ld = mtLatestDone();
  if (t === "upcoming") return "<b>Upcoming is first:</b> every week from Friday 12:00 AM to Tuesday 8:30 PM (Eastern)." + (nd ? " Next up: Match Day " + nd + "." : "");
  return ld ? "<b>Recent is first:</b> from Tuesday 8:31 PM to Thursday 11:59 PM (Eastern). Latest results: Match Day " + ld + "." : "";
}
function mtUpcomingDays() { var dd = mtDays(); return mtDayNums().filter(function (d) { return dd[d].some(function (m) { return !mtDone(m); }); }); }

function renderMatches() {
  var dd = mtDays(), ld = mtLatestDone(), def = mtDefaultTab(), box = document.getElementById("days-list");
  if (!MT.tab) MT.tab = def;
  var R = ["recent", "Recent" + (ld ? " · Day " + ld : "")], U = ["upcoming", "Upcoming"];
  document.getElementById("mt-tabs").innerHTML = (def === "upcoming" ? [U, R] : [R, U]).concat([["previous", "Previous"], ["all", "All"]]).map(function (t) {
    return '<button type="button" data-mt-tab="' + t[0] + '" class="' + (MT.tab === t[0] ? "on" : "") + '">' + t[1] + "</button>";
  }).join("");
  document.getElementById("mt-why").innerHTML = mtWhy(MT.tab, def);
  var h = "";
  if (MT.tab === "recent") {
    var l = ld ? dd[ld].filter(mtMine) : [];
    h = mtTeamBar() + (l.length ? mtDayCard(ld, l, '<span class="mt-badge latest">LATEST</span>') : ld ? mtNone(escapeHtml(mtTname(MT.team)) + " did not play on the latest match day.") : mtNone("No results yet."));
  } else if (MT.tab === "previous") {
    var ps = mtDayNums().filter(function (d) { return ld !== null && d < ld && dd[d].some(mtMine); }).sort(function (a, b) { return b - a; });
    h = mtTeamBar() + (ps.length ? ps.map(function (d) { return mtDayCard(d, dd[d].filter(mtMine)); }).join("") : mtNone(MT.team === "all" ? "Nothing before the latest match day yet." : escapeHtml(mtTname(MT.team)) + " has no earlier matches yet."));
  } else if (MT.tab === "upcoming") {
    var ds = mtUpcomingDays().filter(function (d) { return dd[d].some(function (m) { return !mtDone(m) && mtMine(m); }); });
    if (!ds.length) h = mtTeamBar() + mtNone(MT.team === "all" ? "No more matches to play. See Recent or All." : escapeHtml(mtTname(MT.team)) + " has no more matches to play.");
    else {
      var first = dd[ds[0]].filter(function (m) { return !mtDone(m) && mtMine(m); })[0], wait = mtState(first) === "wait", islive = mtState(first) === "live";
      h = mtTeamBar() + '<div class="mt-next"><div><div class="k">' + (islive ? "Live now" : wait ? "Awaiting results" : "Next kickoff") + '</div><div class="t">' + teamLink(first.home_team_id, mtTname(first.home_team_id)) + " v " + teamLink(first.away_team_id, mtTname(first.away_team_id)) +
        '</div><div class="muted" style="font-size:.82rem;margin-top:2px;">Match Day ' + ds[0] + " &middot; M" + first.match_number + (first.kickoff_at ? " &middot; " + formatKickoff(first.kickoff_at) : "") + '</div></div><div class="cd" id="mt-cd">' +
        (islive ? "LIVE" : wait || !first.kickoff_at ? "—" : mtCd(new Date(first.kickoff_at) - MT.now())) + "<small>" + (islive ? mtLiveText(first) : wait ? "played, result pending" : "until kickoff") + "</small></div></div>" +
        ds.map(function (d, i) { return mtDayCard(d, dd[d].filter(mtMine), i === 0 ? '<span class="mt-badge next">NEXT</span>' : ""); }).join("");
    }
  } else {
    var days = mtDayNums().map(String);
    h = '<div class="card"><div class="mt-filters"><div>' + mtTeamSelect() + '</div><div><label for="mt-day">Match day</label><select id="mt-day"><option value="all">All days</option>' +
      days.map(function (d) { return '<option value="' + d + '"' + (MT.day === d ? " selected" : "") + ">Day " + d + (mtDayDate(+d) ? " · " + mtDayDate(+d) : "") + "</option>"; }).join("") + '</select></div>' +
      '<div><label for="mt-status">Status</label><select id="mt-status">' + [["all", "All"], ["done", "Played"], ["up", "Not played yet"]].map(function (o) { return '<option value="' + o[0] + '"' + (MT.status === o[0] ? " selected" : "") + ">" + o[1] + "</option>"; }).join("") + "</select></div>" +
      '<div><label>Order by date</label><div class="mt-seg"><button type="button" data-mt-order="asc" class="' + (MT.order === "asc" ? "on" : "") + '">Ascending ↑</button><button type="button" data-mt-order="desc" class="' + (MT.order === "desc" ? "on" : "") + '">Descending ↓</button></div></div></div>';
    var L = MT.matches.filter(function (m) { return mtMine(m) && (MT.day === "all" || String(m.match_day) === MT.day) && (MT.status === "all" || (MT.status === "done" ? mtDone(m) : !mtDone(m))); });
    if (MT.team !== "all") {
      var w = 0, d = 0, lo = 0, gf = 0, ga = 0, pl = 0;
      L.filter(function (m) { return mtDone(m) && m.status === "completed"; }).forEach(function (m) {
        var f = m.home_team_id === MT.team ? m.home_score : m.away_score, o = m.home_team_id === MT.team ? m.away_score : m.home_score; pl++; gf += f; ga += o; if (f > o) w++; else if (f < o) lo++; else d++;
      });
      h += '<div class="mt-sum">' + mtLogo(MT.team, 26) + "<b>" + escapeHtml(mtTname(MT.team)) + "</b> " + pl + ' played · <b style="color:var(--ev-goal)">' + w + "W</b> <b>" + d + 'D</b> <b style="color:var(--coral)">' + lo + "L</b> · goals " + gf + "–" + ga + " · " + L.filter(function (m) { return !mtDone(m); }).length + " to play</div>";
    }
    h += "</div>";
    var dl = Array.from(new Set(L.map(function (m) { return m.match_day; }))).sort(function (a, b) { return MT.order === "desc" ? b - a : a - b; });
    h += dl.length ? dl.map(function (d) {
      return mtDayCard(d, L.filter(function (m) { return m.match_day === d; }).sort(function (a, b) { return MT.order === "desc" ? b.match_number - a.match_number : a.match_number - b.match_number; }));
    }).join("") : mtNone("No matches fit those filters.");
  }
  box.innerHTML = h;
  box.querySelectorAll(".match-row").forEach(function (row) {
    row.addEventListener("click", function (ev) { if (ev.target.closest("a,select,button")) return; window.location.href = row.getAttribute("data-href"); });
  });
  var sel = {"mt-team": function (v) { MT.team = v; }, "mt-day": function (v) { MT.day = v; }, "mt-status": function (v) { MT.status = v; }};
  Object.keys(sel).forEach(function (id) { var e = document.getElementById(id); if (e) e.addEventListener("change", function () { sel[id](this.value); renderMatches(); }); });
  box.querySelectorAll("[data-mt-order]").forEach(function (b) { b.addEventListener("click", function () { MT.order = b.dataset.mtOrder; renderMatches(); }); });
}

async function mtFetchEvents(ids) {
  var out = [], CH = 150;
  for (var i = 0; i < ids.length; i += CH) {
    var r = await window.sb.from("match_events").select("*").in("match_id", ids.slice(i, i + CH)).in("event_type", ["goal", "own_goal", "assist"]);
    out = out.concat(r.data || []);
  }
  return out;
}

async function loadMatches() {
  var season = await getCurrentSeason();
  if (!season) return;
  MT.season = season;
  var teamsRes = await window.sb.from("teams").select("*");
  (teamsRes.data || []).forEach(function (t) { MT.teams[t.id] = t; });
  var res = await window.sb.from("matches").select("*").eq("season_id", season.id).order("match_day", { ascending: true }).order("match_number", { ascending: true });
  var container = document.getElementById("days-list");
  if (!res.data || res.data.length === 0) { container.innerHTML = '<p class="muted">No matches scheduled yet.</p>'; return; }
  MT.matches = res.data;
  var ids = MT.matches.map(function (m) { return m.id; });
  // Rested / Absent counts per match and team (only shows once a lineup was entered)
  var apRes = await window.sb.from("match_appearances").select("match_id, team_id, status").in("match_id", ids);
  (apRes.data || []).forEach(function (a) {
    if (a.status !== "rested" && a.status !== "absent") return;
    var k = a.match_id + "|" + a.status;
    MT.att[k] = MT.att[k] || {}; MT.att[k][a.team_id] = (MT.att[k][a.team_id] || 0) + 1;
  });
  await LIVE.syncClock(window.sb);
  var done = MT.matches.filter(function (m) { return m.status === "completed" || mtLive(m); }).map(function (m) { return m.id; });
  MT.events = done.length ? await mtFetchEvents(done) : [];
  var pr = await window.sb.from("players").select("id, full_name");
  (pr.data || []).forEach(function (p) { MT.players[p.id] = p; });
  var hv = (location.hash || "").replace("#", "");
  if (["recent", "previous", "upcoming", "all"].indexOf(hv) >= 0) MT.tab = hv;
  renderMatches();
  document.getElementById("mt-tabs").addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-mt-tab]"); if (!b) return;
    MT.tab = b.dataset.mtTab;
    try { history.replaceState(null, "", "#" + MT.tab); } catch (e) {}
    renderMatches();
  });
  // live matches: refresh scores every 6 s and tick the match clock every second
  setInterval(async function () {
    if (!LIVE.enabled || document.hidden) return;
    var soon = MT.matches.some(function (m) { return mtLive(m) || (m.status === "scheduled" && m.kickoff_at && Date.now() - Date.parse(m.kickoff_at) > -30 * 60000 && Date.now() - Date.parse(m.kickoff_at) < 3 * 3600 * 1000); });
    if (!soon) return;
    var r = await window.sb.from("matches").select("*").eq("season_id", MT.season.id).order("match_day", { ascending: true }).order("match_number", { ascending: true });
    if (!r.data || !r.data.length) return;
    var liveIds = r.data.filter(mtLive).map(function (m) { return m.id; }), doneIds = r.data.filter(function (m) { return m.status === "completed"; }).map(function (m) { return m.id; });
    var evs = liveIds.length ? await mtFetchEvents(liveIds) : [];
    var prevDone = MT.matches.filter(function (m) { return m.status === "completed"; }).length, nowDone = doneIds.length, newEv = nowDone > prevDone ? await mtFetchEvents(doneIds) : MT.events.filter(function (e) { return doneIds.indexOf(e.match_id) >= 0; });
    var sig = JSON.stringify([r.data.map(function (m) { return [m.id, m.status, m.live_phase, m.clock_running, m.clock_rem, m.home_score, m.away_score]; }), evs.length, evs.map(function (e) { return e.id; })]);
    if (sig === MT.sig) return;
    MT.sig = sig; MT.matches = r.data; MT.events = newEv.concat(evs); renderMatches();
  }, 6000);
  setInterval(function () { document.querySelectorAll(".mt-live-clock").forEach(function (el) { var m = MT.matches.filter(function (x) { return x.id === el.dataset.mid; })[0]; if (m && mtLive(m)) el.textContent = "LIVE · " + mtLiveText(m); }); }, 1000);
  setInterval(function () {   // keep the countdown fresh and let the weekly switch happen without a reload
    if (MT.tab === "upcoming" && document.getElementById("mt-cd")) renderMatches();
  }, 60000);
}
loadMatches();
trackPageView("matches").then(function (count) {
  document.getElementById("page-views").textContent = "Page viewed " + formatViewCount(count);
});
</script>

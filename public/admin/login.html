<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login — Phalanx League Soccer</title>
<link rel="stylesheet" href="../css/app.css">
<link rel="icon" type="image/png" href="../assets/brand/favicon.png">
</head>
<body>
<div class="container" style="max-width:420px;">
  <h1>Admin Login</h1>
  <div class="card">
    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="username">
      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password">
      <button class="btn mt-16" type="submit" style="width:100%;">Log in</button>
      <p id="msg"></p>
    </form>
  </div>
  <p class="muted">Only the two league admins have accounts. This area is for editing teams, players, rosters, and match data.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/common.js"></script>
<script>
window.IN_ADMIN_DIR = true;

document.getElementById("login-form").addEventListener("submit", async function (e) {
  e.preventDefault();
  var email = document.getElementById("email").value.trim();
  var password = document.getElementById("password").value;
  var msg = document.getElementById("msg");
  msg.textContent = "Logging in…";
  msg.className = "muted";

  var res = await window.sb.auth.signInWithPassword({ email: email, password: password });
  if (res.error) {
    showError(msg, res.error.message);
    return;
  }
  // Confirm this user is actually whitelisted as an admin.
  var adminRes = await window.sb.from("admins").select("*").eq("user_id", res.data.user.id).maybeSingle();
  if (!adminRes.data) {
    await window.sb.auth.signOut();
    showError(msg, "This account is not authorized as a league admin.");
    return;
  }
  window.location.href = "dashboard.html";
});

// If already logged in as an admin, skip straight to the dashboard.
(async function () {
  var sessionRes = await window.sb.auth.getSession();
  if (sessionRes.data.session) {
    var adminRes = await window.sb.from("admins").select("*").eq("user_id", sessionRes.data.session.user.id).maybeSingle();
    if (adminRes.data) window.location.href = "dashboard.html";
  }
})();
</script>
</body>
</html>

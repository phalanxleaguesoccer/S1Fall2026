<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teams — Phalanx League Soccer</title>
<link rel="stylesheet" href="css/app.css">
<link rel="icon" type="image/png" href="assets/brand/favicon.png">
</head>
<body>
<div class="container">
  <h1>Teams</h1>
  <p class="muted" id="page-views" style="font-size:0.82rem;"></p>
  <div class="grid" id="teams-grid">
    <p class="muted">Loading…</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/common.js"></script>
<script>
renderHeader("teams.html");
renderFooter();
renderBreadcrumbs([{ label: "Home", href: "index.html" }, { label: "Teams" }]);

async function loadTeams() {
  var res = await window.sb.from("teams").select("*").eq("is_active", true).order("name");
  var grid = document.getElementById("teams-grid");

  // Generic schedule placeholders ("Team A", "Team B", ...) aren't real team
  // identities yet — they're only the schedule's slots until the draw
  // assigns a real team to each one. Hide them from this listing; the
  // schedule itself (Matches/Team pages tied to fixtures) is untouched.
  var rows = (res.data || []).filter(function (t) { return !/^Team [A-Z]$/.test(t.name); });

  if (rows.length === 0) {
    grid.innerHTML = '<p class="muted">No teams added yet.</p>';
    return;
  }

  var owners = {}, squadCount = {}, spent = {};
  var season = await getCurrentSeason();
  var budget = 200;
  if (season) {
    if (season.auction_budget != null) budget = season.auction_budget;
    var rosterRes = await window.sb
      .from("team_season_rosters")
      .select("team_id, is_owner, auction_price, players(id, full_name)")
      .eq("season_id", season.id);
    (rosterRes.data || []).forEach(function (r) {
      squadCount[r.team_id] = (squadCount[r.team_id] || 0) + 1;
      if (r.is_owner) { if (r.players) owners[r.team_id] = r.players; }
      else spent[r.team_id] = (spent[r.team_id] || 0) + (r.auction_price || 0);
    });
  }

  grid.innerHTML = rows.map(function (t) {
    var owner = owners[t.id];
    return '<div class="player-card" style="cursor:default;">' +
      '<a href="team.html?id=' + t.id + '" style="text-decoration:none; color:inherit; display:block;">' +
      '<div class="photo-wrap">' +
        (t.crest_url
          ? '<img src="' + escapeHtml(t.crest_url) + '" alt="' + escapeHtml(t.name) + ' crest">'
          : '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Anton;font-size:2rem;color:var(--chalk-dim);">' + escapeHtml(t.name.slice(0,2).toUpperCase()) + '</div>') +
      "</div>" +
      '<div class="info"><div class="name">' + escapeHtml(t.name) + "</div></div>" +
      "</a>" +
      (owner
        ? '<div class="info" style="padding-top:0;"><a class="meta" href="player.html?id=' + owner.id + '" style="text-decoration:none;">Owner: <strong style="color:inherit;">' + escapeHtml(owner.full_name) + "</strong></a></div>"
        : "") +
      '<div class="info" style="padding-top:0;"><div class="meta">' + (squadCount[t.id] || 0) + " player" + ((squadCount[t.id] || 0) === 1 ? "" : "s") +
        " &middot; " + (budget - (spent[t.id] || 0)) + " pts left</div></div>" +
      "</div>";
  }).join("");
}
loadTeams();
trackPageView("teams").then(function (count) {
  document.getElementById("page-views").textContent = "Page viewed " + formatViewCount(count);
});
</script>
</body>
</html>
